
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: portfolioActions
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: portfolioActions
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/lanafarrage/git_actions_ci_cd:latest -f portfolioActions/Dockerfile portfolioActions

      - name: Push Docker image
        run: docker push ghcr.io/lanafarrage/git_actions_ci_cd:latest

  
  
  deploy:
    needs: test
    runs-on: [self-hosted, macOS, X64]
    permissions:
      packages: read

    steps:
      - name: Check Docker
        run: docker info

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull latest image
        run: docker pull ghcr.io/lanafarrage/git_actions_ci_cd:latest

      - name: Stop old container
        run: |
          docker stop django-ci-test || true
          docker rm django-ci-test || true

      - name: Run updated container
        run: |
          docker run -d \
            --name django-ci-test \
            -p 8000:8000 \
            ghcr.io/lanafarrage/git_actions_ci_cd:latest

